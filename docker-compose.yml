services:
  # 1. El servidor que mostrará tu página web
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app

  # 2. Tu API de Node.js
  app:
    build: ./backend       # <-- Ahora busca el Dockerfile aquí
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=colegio_icco_db
      - JWT_SECRET=12345
    depends_on:
      - postgres_db
    volumes:
      - ./backend:/app     # <-- Sincroniza solo el código del backend
      - /app/node_modules

  # 3. Tu Base de Datos
  postgres_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=colegio_icco_db
    volumes:
      - ./init_scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: