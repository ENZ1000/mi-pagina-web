<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Escolar - Acceso</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1>Portal Escolar</h1>
        <p>Inicie sesión con su cuenta institucional</p>
      </div>
      
      <form id="login-form">
        <div class="input-group">
          <label for="username">Usuario / RUT</label>
          <input type="text" id="username" placeholder="ej. admin" required />
        </div>
        
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        
        <button type="submit" class="btn-submit">Ingresar</button>
        <p id="error-msg" class="error-text">Credenciales incorrectas (Prueba: admin / 1234)</p>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
